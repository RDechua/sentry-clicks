[project]
name = "sentry-clicks"
version = "0.0.1"
description = "Mobile ad click fraud detection — Sentry-Clicks portfolio project."
authors = [{ name = "Rubeno Dechua" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Runtime dependencies land in Task 1.3. Kept empty here so the editable install
# in the Dockerfile resolves with zero deps for Task 1.2's smoke test.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Distribution name is `sentry-clicks` (avoids collision with sentry.io's PyPI package).
# Import name is `sentry` via the src/ layout.
packages = ["src/sentry"]
