[project]
name = "sentry-clicks"
version = "0.0.1"
description = "Mobile ad click fraud detection — Sentry-Clicks portfolio project."
authors = [{ name = "Rubeno Dechua" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Runtime dependencies. Versions are NOT pinned here on purpose — `uv.lock` is the
# single source of truth for exact, hash-verified versions. Pinning in both files
# creates churn on every minor upgrade; pinning only in the lockfile keeps
# `pyproject.toml` human-editable while making reproducibility durable.
dependencies = [
  # Data substrate
  "duckdb",
  "pandas",
  "pyarrow",
  # ML
  "lightgbm",
  "scikit-learn",
  "optuna",
  "shap",
  # Config / validation
  "pydantic",
  "pydantic-settings",
  # CLI
  "typer",
  # Logging
  "structlog",
  # Plotting and HTML reports
  "matplotlib",
  "seaborn",
  "jinja2",
]

[dependency-groups]
dev = [
  # Test
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "hypothesis",
  # Lint / format / typecheck
  "ruff",
  "black",
  "mypy",
  # Notebook tooling
  "jupyterlab",
  "nbqa",
]

[tool.uv]
# Install the `dev` group by default when running `uv sync` with no flags.
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Distribution name is `sentry-clicks` (avoids collision with sentry.io's PyPI package).
# Import name is `sentry` via the src/ layout.
packages = ["src/sentry"]

# ---------------------------------------------------------------------------
# Code quality tooling — config locked in CLAUDE.md §5.5.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "experiments"]

[tool.ruff.lint]
# Rule set locked in CLAUDE.md §5.5. `ruff rule <code>` documents each.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.black]
line-length = 100
target-version = ["py311"]
# Black uses regex for extend-exclude (not a path list like ruff).
extend-exclude = "/(notebooks|experiments)/"

[tool.mypy]
python_version = "3.11"
# Strict on src/sentry/ (production code); lenient on tests via override below.
# Notebooks and experiments are not type-checked — they are exploratory.
files = ["src/sentry", "tests"]
strict = true
# PEP 420 namespace packages + explicit bases let tests/ have multiple files
# with the same basename (e.g. tests/unit/.../test_ingestion.py AND
# tests/integration/test_ingestion.py) without needing __init__.py shims.
# `mypy_path = "src"` makes src/ the package root so src/sentry/* is resolved
# as `sentry.*` (single canonical name) — without it, mypy sees the file
# under both `src.sentry.*` and `sentry.*` and errors on the duplication.
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
# Third-party libraries without type stubs. Without this, mypy errors out on
# the first import of any of these in strict mode. (pandas has separate
# stubs in `pandas-stubs` — kept here for now; consider adding the stubs
# package if static typing of DataFrames becomes important.)
module = [
  "pandas.*",
  "pyarrow.*",
  "duckdb.*",
  "lightgbm.*",
  "shap.*",
  "optuna.*",
  "structlog.*",
  "seaborn.*",
  "matplotlib.*",
  "jinja2.*",
  "nbqa.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests: relax the strict-mode rules that make test code miserable to write.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
warn_return_any = false

# ---------------------------------------------------------------------------
# Test framework — pytest + coverage. CLAUDE.md §2.4 (tests-first protocol)
# and build guide Task 1.5 (coverage target 70% on src/sentry/, excluding cli.py).
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Coverage flags are NOT in addopts on purpose — they would force every pytest
# invocation (including inner TDD loops) to pay the coverage.py tracing tax.
# `make check` adds --cov / --cov-report / --cov-fail-under explicitly.
addopts = [
  "--strict-markers",
  "--strict-config",
  # importlib mode is required so test files with the same basename in
  # different directories don't collide on import (e.g. tests/unit/test_data/
  # test_ingestion.py and tests/integration/test_ingestion.py).
  "--import-mode=importlib",
]
markers = [
  "unit: fast in-memory unit tests",
  "integration: tests that touch DuckDB, files, or other I/O",
  "slow: tests that take more than a few seconds",
]

[tool.coverage.run]
source = ["src/sentry"]
# CLI entry points are exercised by integration smoke tests in later weeks,
# not by unit tests — exclude from the unit-coverage target.
omit = ["src/sentry/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
