[project]
name = "sentry-clicks"
version = "0.0.1"
description = "Mobile ad click fraud detection — Sentry-Clicks portfolio project."
authors = [{ name = "Rubeno Dechua" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Runtime dependencies. Versions are NOT pinned here on purpose — `uv.lock` is the
# single source of truth for exact, hash-verified versions. Pinning in both files
# creates churn on every minor upgrade; pinning only in the lockfile keeps
# `pyproject.toml` human-editable while making reproducibility durable.
dependencies = [
  # Data substrate
  "duckdb",
  "pandas",
  "pyarrow",
  # ML
  "lightgbm",
  "scikit-learn",
  "optuna",
  "shap",
  # Config / validation
  "pydantic",
  "pydantic-settings",
  # CLI
  "typer",
  # Logging
  "structlog",
  # Plotting and HTML reports
  "matplotlib",
  "seaborn",
  "jinja2",
]

[dependency-groups]
dev = [
  # Test
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "hypothesis",
  # Lint / format / typecheck
  "ruff",
  "black",
  "mypy",
  # Notebook tooling
  "jupyterlab",
  "nbqa",
]

[tool.uv]
# Install the `dev` group by default when running `uv sync` with no flags.
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Distribution name is `sentry-clicks` (avoids collision with sentry.io's PyPI package).
# Import name is `sentry` via the src/ layout.
packages = ["src/sentry"]

# ---------------------------------------------------------------------------
# Code quality tooling — config locked in CLAUDE.md §5.5.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "experiments"]

[tool.ruff.lint]
# Rule set locked in CLAUDE.md §5.5. `ruff rule <code>` documents each.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.black]
line-length = 100
target-version = ["py311"]
# Black uses regex for extend-exclude (not a path list like ruff).
extend-exclude = "/(notebooks|experiments)/"

[tool.mypy]
python_version = "3.11"
# Strict on src/sentry/ (production code); lenient on tests via override below.
# Notebooks and experiments are not type-checked — they are exploratory.
files = ["src/sentry", "tests"]
strict = true

[[tool.mypy.overrides]]
# Third-party libraries without type stubs. Without this, mypy errors out on
# the first import of any of these in strict mode.
module = [
  "duckdb.*",
  "lightgbm.*",
  "shap.*",
  "optuna.*",
  "structlog.*",
  "seaborn.*",
  "matplotlib.*",
  "jinja2.*",
  "nbqa.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests: relax the strict-mode rules that make test code miserable to write.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
warn_return_any = false
